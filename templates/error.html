{% include "header.html" %}
<section class="relative min-h-screen w-full bg-cover bg-center bg-no-repeat"
  style="background-image: url('{{ url_for('static', filename='images/verification-bg.jpg') }}')">

  <div class="absolute inset-0 bg-white/50"></div>

  <div class="relative z-10 flex flex-col items-center justify-center min-h-screen px-4 py-20">

    <div class="w-full max-w-2xl
                   bg-white/80
                   backdrop-blur-xl
                   rounded-3xl
                   shadow-2xl
                   p-10
                   border border-white/30 text-center">

        <h1 class="text-5xl md:text-6xl font-bold text-red-600 mb-4">
            Error {{ code }}
        </h1>

        <p class="text-xl text-gray-700 mb-6 font-medium">
            {{ message }}
        </p>

        <a href="{{ url_for('index') }}" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl transition-all shadow-md hover:shadow-lg no-underline inline-block">
            Return to Homepage
        </a>
    </div>

  </div>

</section>
{% include "footer.html" %}
