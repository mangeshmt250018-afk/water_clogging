<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <!-- Droplet Path -->
  <path d="M50 12 C50 12, 80 50, 80 66 A 30 30 0 1 1 20 66 C 20 50, 50 12, 50 12 Z" fill="url(#dropGrad)" />
  
  <!-- Alert Circle Overlay -->
  <circle cx="50" cy="66" r="16" fill="white" />
  <circle cx="50" cy="66" r="13" fill="url(#alertGrad)" />
  
  <!-- Alert Exclamation Mark -->
  <rect x="48" y="58" width="4" height="8" rx="2" fill="white" />
  <circle cx="50" cy="71" r="2.5" fill="white" />
